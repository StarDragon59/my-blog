<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✨ Игры</title>
    <link rel="stylesheet" href="style_game.css">
    <style>
        /* Дополнительные стили для крестиков-ноликов */
        .game-status {
            color: #b8d0ff;
            font-size: 1.1em;
            margin-bottom: 20px;
            min-height: 2em;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 350px;
            margin: 0 auto 20px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 16px;
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.x { color: #ff6b6b; text-shadow: 0 0 15px rgba(255, 107, 107, 0.4); }
        .cell.o { color: #4ecdc4; text-shadow: 0 0 15px rgba(78, 205, 196, 0.4); }

        .cell.win-cell {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            color: #b8d0ff;
            font-size: 0.9em;
            margin-bottom: 20px;
            gap: 20px;
        }

        .score {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(100, 150, 255, 0.1);
        }
        .score span { font-weight: bold; color: #ffd700; }
        .score.x-score span { color: #ff6b6b; }
        .score.o-score span { color: #4ecdc4; }

        .game-container:last-of-type {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- ====== ИГРА "УГАДАЙ ЧИСЛО" ====== -->
    <div class="game-container" id="guessGame">
        <h1>🎲 Угадай число</h1>
        <p>🌙 Я загадал число от 1 до 10<br>✨ Сможешь угадать? ✨</p>
        <button id="startBtn">✨ Начать игру ✨</button>
    </div>

    <!-- ====== ИГРА "КРЕСТИКИ-НОЛИКИ" ====== -->
    <div class="game-container" id="tictactoeGame">
        <h1>❌ Крестики-нолики ⭕</h1>
        <div class="game-status" id="status">Твой ход (X)</div>
        
        <div class="scoreboard">
            <div class="score x-score">❌ X: <span id="xScore">0</span></div>
            <div class="score o-score">⭕ O: <span id="oScore">0</span></div>
        </div>
        
        <div class="board" id="board">
            <!-- 9 клеток будут созданы через JavaScript -->
        </div>
        
        <button id="resetBtn">🔄 Новая игра</button>
    </div>

    <script>
        // ========================================
        // 1. ИГРА "УГАДАЙ ЧИСЛО"
        // ========================================
        document.getElementById('startBtn').addEventListener('click', function() {
            const secret = Math.floor(Math.random() * 10) + 1;
            const guess = prompt('🔮 Какое число я загадал? (от 1 до 10)');
            if (guess === null) {
                alert('😔 Магия ждёт тебя в следующий раз!');
            } else if (guess == secret) {
                alert('🎉 Ура! Ты угадал! Магия на твоей стороне! 🎉');
            } else {
                alert(`😢 Ой... Я загадал ${secret}. Попробуй ещё раз! 🌙`);
            }
        });

        // ========================================
        // 2. ИГРА "КРЕСТИКИ-НОЛИКИ" (ПРОТИВ БОТА)
        // ========================================
        (function tictactoe() {
            const board = document.getElementById('board');
            const status = document.getElementById('status');
            const resetBtn = document.getElementById('resetBtn');
            const xScoreSpan = document.getElementById('xScore');
            const oScoreSpan = document.getElementById('oScore');

            // Если элементов нет, выходим
            if (!board || !status) {
                console.error('Ошибка: не найдены элементы для игры!');
                return;
            }

            let boardState = Array(9).fill(null);
            let currentPlayer = 'X';
            let gameActive = true;
            let scores = { X: 0, O: 0 };
            let isBotTurn = false;

            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            function botMove() {
                if (!gameActive || currentPlayer !== 'O') return;
                const emptyCells = boardState
                    .map((cell, index) => cell === null ? index : null)
                    .filter(index => index !== null);
                if (emptyCells.length === 0) return;
                const randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                boardState[randomIndex] = 'O';
                renderBoard();
                const result = checkWinner();
                if (result) {
                    gameActive = false;
                    if (result.winner === 'draw') {
                        updateStatus('Ничья! 🤝');
                    } else {
                        scores[result.winner]++;
                        updateScore();
                        highlightWinCells(result.pattern);
                        updateStatus(`🏆 Победил ${result.winner === 'X' ? '❌ (Ты!)' : '⭕ (Бот!)'}`);
                    }
                    return;
                }
                currentPlayer = 'X';
                isBotTurn = false;
                updateStatus(`Твой ход (X)`);
            }

            function renderBoard() {
                board.innerHTML = '';
                boardState.forEach((value, index) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (value === 'X') cell.classList.add('x');
                    if (value === 'O') cell.classList.add('o');
                    cell.textContent = value || '';
                    cell.dataset.index = index;
                    cell.addEventListener('click', () => handleCellClick(index));
                    board.appendChild(cell);
                });
            }

            function updateStatus(message) {
                status.textContent = message;
            }

            function checkWinner() {
                for (const pattern of winPatterns) {
                    const [a, b, c] = pattern;
                    if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                        return { winner: boardState[a], pattern: pattern };
                    }
                }
                return boardState.every(cell => cell !== null) ? { winner: 'draw' } : null;
            }

            function highlightWinCells(pattern) {
                const cells = document.querySelectorAll('.cell');
                pattern.forEach(index => {
                    cells[index].classList.add('win-cell');
                });
            }

            function updateScore() {
                xScoreSpan.textContent = scores.X;
                oScoreSpan.textContent = scores.O;
            }

            function handleCellClick(index) {
                if (!gameActive || boardState[index] !== null || currentPlayer !== 'X' || isBotTurn) return;
                boardState[index] = 'X';
                renderBoard();
                const result = checkWinner();
                if (result) {
                    gameActive = false;
                    if (result.winner === 'draw') {
                        updateStatus('Ничья! 🤝');
                    } else {
                        scores[result.winner]++;
                        updateScore();
                        highlightWinCells(result.pattern);
                        updateStatus(`🏆 Победил ${result.winner === 'X' ? '❌ (Ты!)' : '⭕ (Бот!)'}`);
                    }
                    return;
                }
                currentPlayer = 'O';
                isBotTurn = true;
                updateStatus('Ход бота (O)... 🤖');
                setTimeout(botMove, 300);
            }

            function resetGame() {
                boardState = Array(9).fill(null);
                currentPlayer = 'X';
                gameActive = true;
                isBotTurn = false;
                renderBoard();
                updateStatus('Твой ход (X)');
            }

            function resetFullGame() {
                scores = { X: 0, O: 0 };
                updateScore();
                resetGame();
            }

            renderBoard();
            updateStatus('Твой ход (X)');
            resetBtn.addEventListener('click', resetFullGame);
        })();
    </script>

</body>
</html>
