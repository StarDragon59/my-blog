<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Игра — Угадай число</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Дневник разработчика</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="about.html">Об авторе</a>
            <a href="game.html">🎮 Игра</a>
        </nav>
    </header>

    <main>
        <div class="game-container">
            <h1>🎲 Угадай число</h1>
            <p>🌙 Я загадал число от 1 до 10<br>✨ Сможешь угадать? ✨</p>
            <button class="game-btn" id="startBtn">✨ Начать игру ✨</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Мой Блог. Сделано с любовью к коду.</p>
    </footer>

    <script>
        const startBtn = document.getElementById('startBtn');
        
        function playGame() {
            let secret = Math.floor(Math.random() * 10) + 1;
            let guess = prompt('🔮 Какое число я загадал? (от 1 до 10)');
            
            if (guess === null) {
                alert('😔 Магия ждёт тебя в следующий раз!');
            } else if (guess == secret) {
                alert('🎉 Ура! Ты угадал! 🎉');
            } else {
                alert(`😢 Ой... Я загадал ${secret}. Попробуй ещё раз! 🌙`);
            }
        }
        
        startBtn.onclick = playGame;
    </script>
</body>
</html>
