<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя галерея — Дневник разработчика</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ШАПКА -->
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">Дневник разработчика</h1>
            <nav class="site-nav">
                <a href="index.html">Главная</a>
                <a href="about.html">Об авторе</a>
                <a href="gallery.html" class="active">📸 Галерея</a>
                <a href="game.html">🎮 Игра</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <article class="post">
            <header class="post__header">
                <h2 class="post__title">📸 Моя галерея</h2>
                <p class="meta">Нажми на картинку, чтобы открыть её в полный экран</p>
            </header>

            <!-- Зона загрузки -->
            <div class="upload-area" id="dropArea">
                <div class="upload-area__icon">✨</div>
                <p class="upload-area__text">Нажми сюда или перетащи картинку</p>
                <p class="upload-area__hint">Можно загрузить сразу несколько файлов</p>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>

            <!-- Галерея -->
            <div class="gallery" id="gallery"></div>
        </article>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Мой Блог. Сделано с любовью к коду.</p>
        </div>
    </footer>

    <!-- ===== ЛАЙТБОКС ===== -->
    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog">
        <button class="lightbox__close" id="lightboxClose" aria-label="Закрыть">✕</button>
        <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Предыдущая">‹</button>
        <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Следующая">›</button>

        <figure class="lightbox__content">
            <img id="lightboxImage" src="" alt="">
            <figcaption class="lightbox__caption" id="lightboxCaption"></figcaption>
        </figure>
    </div>

    <script>
        // ====== ЛОГИКА ГАЛЕРЕИ ======
        const gallery = document.getElementById('gallery');
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('dropArea');

        let imagesArray = JSON.parse(localStorage.getItem('myGallery')) || [];

        function renderGallery() {
            gallery.innerHTML = '';

            if (imagesArray.length === 0) {
                gallery.innerHTML = `
                    <p class="gallery__empty">
                        Пока здесь пусто — загрузи первую картинку!
                    </p>`;
                return;
            }

            imagesArray.forEach((imageDataUrl, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-card';

                const img = document.createElement('img');
                img.src = imageDataUrl;
                img.alt = `Фото ${index + 1}`;
                img.loading = 'lazy';

                // Открытие лайтбокса по клику
                img.addEventListener('click', () => openLightbox(index));

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '✕';
                deleteBtn.className = 'gallery-card__delete';
                deleteBtn.title = 'Удалить';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // чтобы не сработал лайтбокс
                    deleteImage(index);
                };

                card.appendChild(img);
                card.appendChild(deleteBtn);
                gallery.appendChild(card);
            });
        }

        function saveGallery() {
            localStorage.setItem('myGallery', JSON.stringify(imagesArray));
            renderGallery();
        }

        function deleteImage(index) {
            if (!confirm('Удалить эту картинку?')) return;
            imagesArray.splice(index, 1);
            saveGallery();
        }

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    imagesArray.push(event.target.result);
                    saveGallery();
                };
                reader.readAsDataURL(file);
            });
        }

        dropArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('is-dragover');
        });
        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('is-dragover');
        });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('is-dragover');
            handleFiles(e.dataTransfer.files);
        });

        // ====== ЛОГИКА ЛАЙТБОКСА ======
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('is-open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden'; // блокируем скролл
        }

        function closeLightbox() {
            lightbox.classList.remove('is-open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const total = imagesArray.length;
            lightboxImage.src = imagesArray[currentIndex];
            lightboxImage.alt = `Фото ${currentIndex + 1}`;
            lightboxCaption.textContent = `${currentIndex + 1} из ${total}`;

            // Скрываем стрелки, если картинка всего одна
            const single = total <= 1;
            lightboxPrev.style.display = single ? 'none' : 'flex';
            lightboxNext.style.display = single ? 'none' : 'flex';
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + imagesArray.length) % imagesArray.length;
            updateLightbox();
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % imagesArray.length;
            updateLightbox();
        }

        // Обработчики
        lightboxClose.addEventListener('click', closeLightbox);
        lightboxPrev.addEventListener('click', showPrev);
        lightboxNext.addEventListener('click', showNext);

        // Клик по фону закрывает лайтбокс
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Управление с клавиатуры
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('is-open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'ArrowRight') showNext();
        });

        // Свайпы для мобильных
        let touchStartX = 0;
        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) showNext();
                else showPrev();
            }
        });

        renderGallery();
    </script>

</body>
</html>
